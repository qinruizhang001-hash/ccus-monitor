name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  static:
    name: typecheck / lint / licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      # 必须先 typegen 再 tsc：Next 16 把 `LayoutProps<"/">` 这类全局类型写进
      # .next/types，干净检出里没有它，直接 `tsc --noEmit` 一定报 TS2304。
      - run: npm run typecheck
      - run: npm run lint
      # 强 copyleft 依赖不会让构建失败，只会在法务那里失败 —— 所以单独查一遍。
      - run: npm run licenses

  test:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test

  build:
    name: production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
